name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -x bin/ds bin/ds-say bin/ds-status libexec/ds-inbox-hook libexec/ds-common.sh install.sh tests/run.sh tests/fake-claude
      - name: python syntax
        run: python3 -m py_compile libexec/ds_status.py
      - name: tests
        run: bash tests/run.sh
